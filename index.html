<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mì Quảng Bách Khoa</title>
<meta name="description" content="Game quán mì Quảng của sinh viên Bách Khoa Đà Nẵng, lấy cảm hứng từ Mì Quảng Bích ở Hòa Khánh Bắc. Đua điểm theo lớp, theo khoa.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B3A6B">
<script>/* đặt giao diện trước khi vẽ trang để không bị nháy */
try{var t=localStorage.getItem('mqbk-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="apple-mobile-web-app-title" content="Mì Quảng BK">
<meta property="og:title" content="Mì Quảng Bách Khoa">
<meta property="og:description" content="Game quán mì Quảng của sinh viên Bách Khoa Đà Nẵng. Đua điểm theo lớp, theo khoa.">
<meta property="og:image" content="https://phu759042-source.github.io/mi-quang-bach-khoa/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/giao-dien.css?v=2.13.0">
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="stat"><span>Ngày</span><b id="sDay">1</b></div>
    <div class="stat time"><span>Giờ</span><b id="sTime">75s</b></div>
    <div class="stat"><span>Hôm nay</span><b id="sEarn">0k</b></div>
    <div class="stat"><span>Uy tín</span><b id="sRep" class="hearts"></b></div>
  </div>
  <div class="event" id="sEvent"></div>
  <div class="tables" id="tables"></div>
  <div class="station">
    <div class="pause-slot" id="pauseSlot"></div>
    <div class="snd-slot" id="sndSlot"></div>
    <svg id="bowl" viewBox="0 0 240 150" aria-label="Tô mì"></svg>
    <div class="hint" id="hint"></div>
  </div>
  <div class="kitchen">
    <div class="k-head desk"><b>Bếp</b><span>Phím 1–8 chọn món · Q W E R bưng cho bàn</span></div>
    <div class="pad" id="pad"></div>
    <div class="acts">
      <button class="btn ghost" id="trash">Đổ bỏ<kbd>X</kbd></button>
      <button class="btn pour" id="pour">Chan nước lèo<kbd>Space</kbd></button>
    </div>
  </div>
  <div class="ov" id="ov"></div>
  <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></div>
  <div class="visits" id="visits" hidden aria-live="polite" title="Mỗi lần mở trang tính 1 lượt truy cập">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    <span><b id="vTong">—</b> lượt truy cập · <b id="vNguoi">—</b> người</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/ban-ghi.js?v=2.13.0"></script>
<script src="js/cau-hinh.js?v=2.13.0"></script>
<script src="js/vong-choi.js?v=2.13.0"></script>
<script src="js/mang.js?v=2.13.0"></script>
<script src="js/am-thanh.js?v=2.13.0"></script>
<script src="js/nop-diem.js?v=2.13.0"></script>
<script src="js/hien-thi.js?v=2.13.0"></script>
<script src="js/tai-khoan.js?v=2.13.0"></script>
<script src="js/man-hinh.js?v=2.13.0"></script>
<script src="js/solo.js?v=2.13.0"></script>
<script src="js/thong-bao.js?v=2.13.0"></script>
<script src="js/hieu-ung.js?v=2.13.0"></script>
<script src="js/giu-quan.js?v=2.13.0"></script>
<script src="js/dieu-huong.js?v=2.13.0"></script>
<script src="js/khoi-dong.js?v=2.13.0"></script>
</body>
</html>
