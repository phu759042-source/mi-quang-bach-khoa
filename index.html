<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mì Quảng Bách Khoa</title>
<meta name="description" content="Game quán mì Quảng của sinh viên Bách Khoa Đà Nẵng, lấy cảm hứng từ Mì Quảng Bích ở Hòa Khánh Bắc. Đua điểm theo lớp, theo khoa.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B3A6B">
<script>/* đặt giao diện trước khi vẽ trang để không bị nháy */
try{var t=localStorage.getItem('mqbk-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="apple-mobile-web-app-title" content="Mì Quảng BK">
<meta property="og:title" content="Mì Quảng Bách Khoa">
<meta property="og:description" content="Game quán mì Quảng của sinh viên Bách Khoa Đà Nẵng. Đua điểm theo lớp, theo khoa.">
<meta property="og:image" content="https://phu759042-source.github.io/mi-quang-bach-khoa/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone game — status strip, customer tables, bowl as hero, ingredient pad at thumb height; overlays for account, difficulty and rankings */
:root{
  color-scheme: light;
  --navy:#1B3A6B; --turmeric:#E8A317; --chili:#C8321E; --leaf:#2F6B3A;
  --paper:#FBF3E3; --ink:#2A2118; --muted:#7A6A55; --line:#E6D6B8; --card:#FFFDF8; --soft:#FFF4D6;
  --gold:#C99A1E; --silver:#8C96A3; --bronze:#A8663A;
  --heading:#1B3A6B; --toast-bg:#2A2118; --toast-fg:#FFFFFF; --on-warm:#2A2118; --shade:#E6D6B8;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Giao diện tối: quán mì lúc đêm, nền xanh than */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --navy:#2A5599; --turmeric:#F0B23A; --chili:#F26B55; --leaf:#62B373;
  --paper:#11161F; --ink:#F2EADB; --muted:#A99C88; --line:#2B3443; --card:#1A212D; --soft:#2E2817;
  --gold:#E2B54A; --silver:#A9B3C0; --bronze:#C98552;
  --heading:#A9C4F5; --toast-bg:#F2EADB; --toast-fg:#11161F; --shade:#0A0E15}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --navy:#2A5599; --turmeric:#F0B23A; --chili:#F26B55; --leaf:#62B373;
  --paper:#11161F; --ink:#F2EADB; --muted:#A99C88; --line:#2B3443; --card:#1A212D; --soft:#2E2817;
  --gold:#E2B54A; --silver:#A9B3C0; --bronze:#C98552;
  --heading:#A9C4F5; --toast-bg:#F2EADB; --toast-fg:#11161F; --shade:#0A0E15}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;position:relative;user-select:none;-webkit-user-select:none}

.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat.time b{color:var(--chili)}
.hearts{color:var(--chili);display:flex!important;gap:2px;align-items:center;height:20px}
.hearts svg{width:11px;height:11px;flex:none}
.kitchen{display:contents}
.desk{display:none!important}
kbd{display:none;font:700 10px/1 var(--body);color:var(--muted);background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 5px;min-width:18px;text-align:center}
@media (hover:hover) and (pointer:fine){
  kbd{display:inline-block}
  .ing{position:relative}.ing kbd{position:absolute;top:5px;right:5px}
  .cust kbd.k-table{position:absolute;top:6px;right:6px}
  .btn kbd{margin-left:8px;vertical-align:2px;background:transparent;color:inherit;border-color:currentColor;opacity:.7}
  .ing:hover{border-color:var(--turmeric)}
  .cust[data-i]:hover{border-color:var(--heading)}
}
.event{font-size:12px;font-weight:700;color:var(--heading);text-align:center;margin-top:-4px}
.event{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px}
.event .tag.rush{background:var(--chili);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.queue{display:inline-flex;align-items:center;gap:5px;color:var(--chili);font-weight:700}
.queue i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.event .tag{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;margin-right:4px;font-size:11px}

.tables{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}
.cust{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:7px 6px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;min-height:132px;cursor:pointer;position:relative;transition:transform .12s;min-width:0}
.cust:active{transform:scale(.96)}
.cust.empty{border-style:dashed;justify-content:center;color:var(--muted);font-size:12px;cursor:default;background:transparent}
.cust.teacher{border-color:var(--heading);box-shadow:inset 0 0 0 1.5px var(--heading)}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:12px;font-weight:800;line-height:1}
.who{font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.order{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:var(--paper);border-radius:8px;padding:3px}
.order svg{width:20px;height:20px}
.pat{width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:auto}
.pat i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.quote{font-size:10px;color:var(--muted);text-align:center;line-height:1.25;font-style:italic}

.station{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#bowl{width:100%;max-width:300px;height:auto;max-height:100%}
.hint{font-size:13px;font-weight:600;color:var(--muted);text-align:center;min-height:18px}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ing{font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
.ing svg{width:30px;height:30px}
.ing span{font-size:11px;font-weight:700}
.ing.on{border-color:var(--turmeric);background:var(--soft)}
.ing:active{transform:scale(.94)}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{font:inherit;font-family:var(--display);font-weight:800;font-size:17px;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--navy);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.btn.warm{background:var(--turmeric);color:var(--on-warm)}
.btn.pour{background:#C8321E}
.btn:disabled{opacity:.45;cursor:default}
.link{font:inherit;background:none;border:0;color:var(--heading);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}

/* overlays */
.ov{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;gap:14px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px;z-index:5;overflow-y:auto;user-select:text;-webkit-user-select:text}
.ov > *{flex-shrink:0}
.ov .grow{margin-top:auto}
.ov{padding-bottom:52px!important}
.ov h1{font-family:var(--display);font-weight:800;font-size:42px;line-height:.95;margin:0;color:var(--heading);text-wrap:balance}
.ov h1 em{font-style:normal;color:var(--turmeric);display:block}
.ov h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.05;color:var(--heading);text-wrap:balance}
.ov p{margin:0;line-height:1.5;max-width:60ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--chili)}
.steps{margin:0;padding-left:20px;line-height:1.6;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.msg{font-size:13px;font-weight:600;min-height:18px;color:var(--chili)}
.msg.ok{color:var(--leaf)}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1}
label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}

.me{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.me .nm{font-weight:700;font-size:16px}
.me .sub{font-size:12px;opacity:.8}
.me .pts{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.me .pts small{display:block;font-family:var(--body);font-size:11px;opacity:.8;font-weight:600}

.diffs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.diff.d-bk .x{color:var(--heading)}
.diff b{white-space:nowrap}
@media (max-width:420px){.diff b{font-size:13px}.diff .x{font-size:19px}.diff small{font-size:10px}.diff{padding:9px 3px}}
.diff{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.diff b{font-family:var(--display);font-size:17px;line-height:1}
.diff .x{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.diff small{font-size:11px;color:var(--muted);line-height:1.3}
.diff[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--soft)}
.diff.d-dianguc .x{color:var(--chili)}
.diff.d-kho .x{color:var(--turmeric)}
.diff.d-thuong .x{color:var(--leaf)}

.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.up strong{font-size:14px}
.up small{grid-column:1;color:var(--muted);font-size:12px}
.up button{grid-row:1/3;grid-column:2;font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:8px 12px;background:var(--turmeric);color:var(--on-warm);cursor:pointer}
.up button:disabled{background:var(--line);color:var(--muted)}

/* bảng xếp hạng */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;border-radius:9px;padding:8px 4px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--card);border:1.5px solid var(--line);border-radius:12px 12px 4px 4px;padding:10px 6px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:2px}
.pod .rk{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.pod .nm{font-weight:700;font-size:13px;overflow-wrap:anywhere;line-height:1.25}
.pod .sb{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.pod .pt{font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.pod.r1{border-color:var(--gold);padding-block:18px 12px;background:var(--soft)} .pod.r1 .rk{color:var(--gold)}
.pod.r2 .rk{color:var(--silver)} .pod.r3 .rk{color:var(--bronze)}
.list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .rk{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.li .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.li .sb{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.li .pt{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.li.mine{background:var(--soft);box-shadow:inset 3px 0 0 var(--turmeric)}
.empty-state{padding:22px 14px;text-align:center;color:var(--muted)}
.donate{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:14px;align-items:start}
.donate img{width:100%;height:auto;border-radius:14px;border:1.5px solid var(--line);background:#fff}
@media (max-width:620px){.donate{grid-template-columns:1fr;justify-items:center}.donate img{max-width:280px}.donate .list{width:100%}}
.theme{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
.theme span{margin-right:4px}
.theme button{font:inherit;font-size:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.heart-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.heart-row .lbl{font-weight:700}
.hearts.big{color:var(--chili);display:inline-flex;gap:3px}.hearts.big svg{width:20px;height:20px}
.plus{font:800 20px/1 var(--display);width:36px;height:36px;border-radius:50%;border:0;background:var(--chili);color:#fff;cursor:pointer;display:grid;place-items:center}
.plus:disabled{background:var(--line);color:var(--muted);cursor:default}
/* ===== Chuỗi ngày ===== */
.streak-pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted)}
.streak-pill .flame{width:24px;height:30px;flex:none}
.streak-pill b{font-family:var(--display);font-size:22px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.streak-pill span{font-size:12px;font-weight:600;line-height:1.3}
.streak-pill.on{border-color:#F59A2A;background:var(--soft)}
.streak-pill.on b{color:#E8661E}
.streak-stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-block:auto}
.flame-wrap{position:relative;width:160px;height:190px;margin-bottom:-6px}
.flame-wrap .flame{position:absolute;left:20px;top:10px;width:120px;height:150px;transform-origin:50% 90%}
.glow{position:absolute;left:50%;top:55%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,40,.55),rgba(255,120,30,.18) 45%,transparent 70%);opacity:0;animation:glowIn .9s .7s ease-out forwards}
.f-gray{animation:grayOut .5s .55s ease-in forwards}
.f-lit{opacity:0;transform:scale(.25);animation:litPop .7s .65s cubic-bezier(.2,1.6,.4,1) forwards,flicker 1.6s 1.4s ease-in-out infinite}
.sparks{position:absolute;left:50%;bottom:34px}
.sparks i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#FFB23A;box-shadow:0 0 6px #FF8A1F;opacity:0;
  animation:spark 1.1s var(--d) ease-out forwards}
.streak-num b{display:inline-block;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:#E8661E;font-variant-numeric:tabular-nums}
.streak-num b.pop{animation:numPop .5s cubic-bezier(.2,1.8,.4,1)}
.record{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#E8661E;border-radius:999px;padding:4px 12px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;max-width:360px;margin-top:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;color:#fff;font-size:14px}
.wd.on i{background:#F59A2A;border-color:#F59A2A}
.wd.today i{border-color:#F59A2A;animation:todayLit .4s 1.1s ease-out forwards}
.wd.today span{color:#E8661E}
.wd.future i{opacity:.5}
.streak-stage .btn{width:100%;max-width:360px;margin-top:8px}
@keyframes grayOut{to{opacity:0;transform:scale(.85)}}
@keyframes litPop{0%{opacity:0;transform:scale(.25)}100%{opacity:1;transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) skewX(0)}30%{transform:scale(1.04,.97) skewX(-2deg)}60%{transform:scale(.97,1.04) skewX(2deg)}}
@keyframes glowIn{to{opacity:1}}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-150px) scale(.4)}}
@keyframes numPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes todayLit{to{background:#F59A2A;box-shadow:0 0 0 4px rgba(245,154,42,.25)}}
@media (prefers-reduced-motion:reduce){
  .f-gray{display:none}.f-lit{opacity:1;transform:none;animation:none}.glow{opacity:1;animation:none}.sparks{display:none}
  .wd.today i{background:#F59A2A;animation:none}.streak-num b.pop{animation:none}}
@media (min-width:900px) and (min-height:560px){.streak-stage{max-width:520px!important}.flame-wrap{transform:scale(1.15)}}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block;background:var(--line)}
.av-txt{display:inline-grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;line-height:1}
.me.has-av{grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px}
.me.has-av .me-av{grid-row:1/3;align-self:center;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.me.has-av .nm,.me.has-av .sub{grid-column:2}
.me.has-av .pts{grid-column:3}
.li .nm.with-av{display:flex;align-items:center;gap:10px}
.pod .pod-av{margin:0 auto 4px;box-shadow:0 0 0 3px var(--card)}
.pod.r1 .pod-av{box-shadow:0 0 0 3px var(--gold)}
.av-edit{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.av-edit .row .link{font-size:13px}
.crop{position:relative;width:min(300px,100%);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;background:#000;user-select:none}
.crop:active{cursor:grabbing}
.crop canvas{width:100%;height:100%;display:block}
.crop .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.85);outline-offset:-2px;pointer-events:none}

/* Mục tiêu: doanh thu chuẩn mỗi ngày, lấy từ mô phỏng 2.000 ván của người chơi khá
   (trung bình giữa người chơi giỏi và trung bình, có mua nâng cấp dần), nhân tỉ lệ 75% ở ngày 1, +3% mỗi ngày, tối đa 100% */
const REF={
  thuong:[820,1130,1630,1040,1540,2190,2550,2160,2380,2550,2440,2740],
  kho:[1000,1300,1690,1270,1760,2290,2490,2470,2430,2460,2310,2910],
  dianguc:[1160,1470,1660,1550,1970,2260,2330,2740,2390,2320,1920,2850],

function target(d){
  const r=REF[diff]||REF.thuong;
  const ref=d<=12?r[d-1]:r[8+((d-1)%4)]*(1+.06*(d-12));
  return Math.round(ref*Math.min(1,.75+.03*(d-1))/10)*10;
}
const RUSH=[25,45]; // giờ cao điểm: khi đồng hồ còn 45s → 25s, khách đến gấp đôi
const inRush=()=>D&&D.t<=RUSH[1]&&D.t>RUSH[0];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function startDay(){
  const n=lv('ban')?4:3;
  D={t:DAYLEN,earned:0,served:0,lost:0,slots:Array(n).fill(null),queue:[],rushSaid:false,spawnT:1.2,shield:lv('the'),
     bowl:{items:new Set(lv('phubep')?['mi']:[]),broth:false},ev:EVENTS[(S.day-1)%4]};
  showOv(false); renderAll(); running=true; last=performance.now(); requestAnimationFrame(loop);
}
function spawn(){
  const i=D.slots.findIndex(x=>!x);
  if(i<0&&D.queue.length>=(lv('ghe')?6:4)) return;
  const df=DIFF[diff], kh=pick(KHACH), teacher=Math.random()<.08;
  let nTop=Math.min(4,Math.max(1,Math.floor(rnd(1,2.6+S.day*.35+df.top))));
  const combo=lv('combo')&&nTop>1&&Math.random()<.5; if(combo) nTop--;
  const tops=[...TOPS].sort(()=>Math.random()-.5).slice(0,nTop);
  const order=['mi',...TOPS.filter(t=>tops.includes(t)&&!(t==='rau'&&lv('rau')))];
  const cool=(1+.15*lv('quat'))*D.ev.pat*df.pat;
  const max=(Math.max(9,22-S.day)+nTop*2.5)*cool*(teacher?.8:1);
  const qmax=Math.max(8,14-S.day*.5)*cool*(1+.25*lv('ghe'));
  const price=(25+5*nTop-(combo?5:0))*(1+.1*lv('bang'))*(teacher?2:1);
  const c={kh,teacher,order,max,p:max,qmax,q:qmax,price,line:teacher?'Thầy ghé ăn trưa, nhanh giúp thầy nhé':pick(LINES)};
  if(i>=0){D.slots[i]=c;renderTables()} else {D.queue.push(c);renderStats()}
}
function seatQueue(){
  let moved=false;
  D.slots.forEach((c,i)=>{if(!c&&D.queue.length){D.slots[i]=D.queue.shift();moved=true}});
  if(moved){renderTables();renderStats()}
}
function loop(now){
  if(!running) return;
  const dt=Math.min(.1,(now-last)/1000); last=now;
  D.t-=dt;
  if(D.t>0){
    D.spawnT-=dt;
    if(inRush()&&!D.rushSaid){D.rushSaid=true;toast('Giờ cao điểm! Khách đến gấp đôi');renderStats()}
    if(!inRush()&&D.rushSaid&&D.t<=RUSH[0]&&!D.rushEnd){D.rushEnd=true;renderStats()}
    if(D.spawnT<=0){spawn();const base=Math.max(2.2,5.4-S.day*.3)*(1-.06*lv('bang'))*(1-.1*lv('fanpage'))*DIFF[diff].spawn*(inRush()?.5:1);D.spawnT=rnd(base*.7,base*1.3)*D.ev.spawn}
  }
  seatQueue();
  const pdt=dt*(inRush()&&lv('tv')?.7:1); // TV: giờ cao điểm khách bớt sốt ruột
  for(let k=D.queue.length-1;k>=0;k--){const c=D.queue[k];c.q-=pdt;if(c.q<=0&&running){
    if(D.shield>0){D.shield--;c.q=c.qmax*.5;toast('Thẻ tích điểm giữ chân khách');continue}
    D.queue.splice(k,1);sfx.leave();loseHeart('Khách xếp hàng lâu quá nên bỏ về')}}
  if(!running) return;
  D.slots.forEach((c,i)=>{if(!c)return;c.p-=pdt;if(c.p<=0&&running){
    if(D.shield>0){D.shield--;c.p=c.max*.5;toast('Thẻ tích điểm giữ chân khách');return}
    sfx.leave();angry(i,'Khách bỏ đi vì chờ lâu')}});
  if(!running) return;
  updateBars();
  if(D.t<=0){endDay();return}
  requestAnimationFrame(loop);
}
function angry(i,msg){

function loseHeart(msg){

}
const heartsHTML=n=>Array.from({length:TIM_MAX},(_,i)=>`<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 5-4 8.5-11 14z" fill="${i<n?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/></svg>`).join('');
function buyHeart(){

const heartRow=()=>solo?`<div class="heart-row"><span class="lbl">Uy tín</span><span class="hearts big">${heartsHTML(S.rep)}</span><span class="muted">Solo không mua lại tim</span><button type="button" id="buyHeart" hidden></button></div>`:`<div class="heart-row"><span class="lbl">Uy tín</span><span class="hearts big" aria-label="Còn ${S.rep} trên ${TIM_MAX} tim">${heartsHTML(S.rep)}</span>

function reviveScreen(){

    <div class="col grow"><button class="btn" id="resume" ${S.rep>0?'':'disabled'}>Bán tiếp với ${S.rep} tim</button>
    <button class="btn ghost" id="close">Đóng quán, chốt điểm</button></div>`);
    $('buyHeart').onclick=()=>{if(buyHeart())draw()};

    $('close').onclick=()=>finishRun('Mất hết uy tín, bạn đóng quán sớm.');

function resumeDay(){
  if(S.rep<=0) return;
  // khách đang chờ được nghỉ một nhịp sau khi quán lấy lại uy tín
  D.slots.forEach(c=>{if(c)c.p=Math.max(c.p,c.max*.5)}); D.queue.forEach(c=>c.q=Math.max(c.q,c.qmax*.5));
  showOv(false); renderAll(); running=true; last=performance.now(); requestAnimationFrame(loop);
}
function serve(i){
  const c=D.slots[i]; if(!c||!running) return;
  const b=D.bowl;
  if(!b.items.size){toast('Tô còn trống');return}
  if(!b.broth&&lv('noi')&&b.items.has('mi')){b.broth=true;sfx.pour()}
  if(!b.broth){toast('Chưa chan nước lèo');return}
  const ok=matches(c,b);
  const el=$('tables').children[i];
  resetBowl();
  if(!ok){sfx.wrong();angry(i,'Sai món rồi, khách không chịu');return}
  const tip=Math.round(c.price*.3*(c.p/c.max)*D.ev.tip*(lv('wifi')?1.5:1)*(lv('fanpage')>=2?1.2:1));
  const gain=Math.round(c.price)+tip+(lv('qr')?3:0);
  D.earned+=gain;S.money+=gain;S.total+=gain;D.served++;sfx.cash(c.teacher||tip>c.price*.2);
  floatText(el,`+${gain}k`,tip>0?'var(--leaf)':'var(--heading)');
  D.slots[i]=null; renderTables(); renderStats();
}
function matches(c,b){
  const want=new Set(c.order), got=new Set(b.items);
  if(lv('rau')) got.delete('rau');
  return want.size===got.size&&[...want].every(x=>got.has(x));
}
/* Nhân viên chạy bàn: tô vừa chan nước lèo khớp món của khách nào thì bưng cho người sắp hết kiên nhẫn nhất */
function autoServe(){
  if(!lv('chay')||!running||!D.bowl.broth) return;
  let best=-1;
  D.slots.forEach((c,i)=>{if(c&&matches(c,D.bowl)&&(best<0||c.p/c.max<D.slots[best].p/D.slots[best].max))best=i});
  if(best>=0) setTimeout(()=>{if(running&&D.slots[best]&&D.bowl.broth&&matches(D.slots[best],D.bowl))serve(best)},250);
}
function resetBowl(){D.bowl={items:new Set(lv('phubep')?['mi']:[]),broth:false};renderBowl();renderPad()}
function endDay(){
  running=false;
  if(solo){soloPush(true); if(S.day>=SOLO_NGAY){soloFinish('Đã bán đủ 3 ngày.');return} soloShop(); return}
  if(D.earned<target(S.day)){finishRun(`Hôm nay chỉ bán được ${D.earned}k, chưa đủ ${target(S.day)}k tiền mặt bằng.`);return}
  showShop();
}

/* ================= Mạng: gửi lại khi lỗi (Safari iOS hay hỏng kết nối cũ) ================= */
const isNetErr=err=>!err.code&&/load failed|failed to fetch|networkerror|network request|fetch/i.test(err.message||'');
async function rpcRetry(fn,args,tries=4){
  let res;
  for(let i=0;i<tries;i++){
    try{res=await sb.rpc(fn,args)}catch(e){res={data:null,error:{message:String(e)}}}
    if(!res.error||!isNetErr(res.error)) return res;
    await new Promise(r=>setTimeout(r,[400,1200,2500][i]||2500));
  }
  return res;
}
function savePending(p){try{localStorage.setItem('mqbk-pending',JSON.stringify(p))}catch(e){}}
function loadPending(){try{return JSON.parse(localStorage.getItem('mqbk-pending'))}catch(e){return null}}
function clearPending(){try{localStorage.removeItem('mqbk-pending')}catch(e){}}
let memPending=null;
async function submitPending(p){
  memPending=p;
  const res=await rpcRetry('nop_ket_qua',{p_run_id:p.run,p_so_ngay:p.so_ngay,p_doanh_thu:p.doanh_thu,p_tim_mat:p.tim_mat});
  if(!res.error){clearPending();memPending=null;return res}
  if(isNetErr(res.error)) return res;              // giữ lại để nộp sau
  clearPending();memPending=null;                  // lỗi từ server: không thử lại nữa
  if(/đã nộp/.test(res.error.message)){await loadProfile();return {data:{delta:null,diem:profile?.diem??0,hang:myRank}}}
  return res;
}
// Nộp kết quả còn treo trước khi mở lượt mới, để lượt cũ không bị tính là bỏ dở
async function flushPending(){
  const p=loadPending()||memPending;
  if(!p||!user||p.uid!==user.id) return true;
  const {error}=await submitPending(p);
  if(!error){await loadProfile();return true}
  return !isNetErr(error);
}

const SFX={on:true,ctx:null,out:null};
const POUR_KIEU='B';
try{SFX.on=localStorage.getItem('mqbk-sound')!=='off'}catch(e){}
function ac(){
  if(!SFX.on) return null;
  if(!SFX.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    SFX.ctx=new C(); const comp=SFX.ctx.createDynamicsCompressor(); SFX.out=SFX.ctx.createGain(); SFX.out.gain.value=.55;
    SFX.out.connect(comp); comp.connect(SFX.ctx.destination)}
  if(SFX.ctx.state==='suspended'&&!SFX.offline) SFX.ctx.resume();
  return SFX.ctx;
}
// trình duyệt chỉ cho phát tiếng sau khi người dùng chạm/bấm lần đầu
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(SFX.on)ac()},{once:true,capture:true}));
function tone(f,dur,{type='sine',vol=.3,at=0,to=null,attack=.005}={}){
  const c=ac(); if(!c) return; const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(SFX.out); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,{vol=.25,at=0,type='bandpass',f=1000,to=null,q=1,attack=.01}={}){
  const c=ac(); if(!c) return; const t=c.currentTime+at, n=Math.ceil(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain(); s.buffer=buf;
  fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(f,t); if(to) fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(SFX.out); s.start(t); s.stop(t+dur+.02);
}

/* ================= Chuỗi ngày (streak) ================= */
// Ngày theo giờ Việt Nam, dạng YYYY-MM-DD; off = số ngày lệch so với hôm nay
const vnDate=(off=0)=>new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Ho_Chi_Minh'});
function guestStreak(){try{return JSON.parse(localStorage.getItem('mqbk-streak'))||{chuoi:0,ngay:null,best:0}}catch(e){return {chuoi:0,ngay:null,best:0}}}
function streakState(){
  const s=ranked&&profile?{chuoi:profile.chuoi||0,ngay:profile.ngay_chuoi||null,best:profile.chuoi_dai_nhat||0}:guestStreak();
  const lit=s.ngay===vnDate(), alive=lit||s.ngay===vnDate(-1);
  return {n:alive?s.chuoi:0,lit,best:s.best};
}
// Người chơi thử: tự tính chuỗi trên máy
function bumpGuestStreak(){
  const s=guestStreak(), today=vnDate();
  if(s.ngay===today) return {moi:false,chuoi:s.chuoi,best:s.best};
  s.chuoi=s.ngay===vnDate(-1)?s.chuoi+1:1; s.ngay=today; s.best=Math.max(s.best||0,s.chuoi);
  try{localStorage.setItem('mqbk-streak',JSON.stringify(s))}catch(e){}
  return {moi:true,chuoi:s.chuoi,best:s.best};
}
let flameId=0;

    <linearGradient id="${id}i" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${lit?'#FFB23A':'#C9CDD3'}"/><stop offset="1" stop-color="${lit?'#FFF0A8':'#E4E7EB'}"/></linearGradient></defs>
    <path fill="url(#${id}o)" d="M32 3c4 15 21 23 21 44a21 21 0 0 1-42 0c0-10 5-17 10-21 0 8 3 12 8 13C26 26 27 14 32 3z"/>
    <path fill="url(#${id}i)" d="M33 36c3 7 11 11 11 20a12 12 0 0 1-24 0c0-6 3-9 6-11 1 4 3 7 6 7-1-6-1-11 1-16z"/></svg>`;
}
const streakPill=()=>{const s=streakState();
  return `<div class="streak-pill ${s.lit?'on':''}">${flameSVG(s.lit)}<b>${s.n}</b><span>${s.n?'ngày liên tiếp':'Chưa có chuỗi'}${s.lit?' · hôm nay đã giữ lửa':' · chốt sổ 1 lượt hôm nay để '+(s.n?'giữ':'thắp')+' lửa'}</span></div>`};
// Màn hiệu ứng: lửa xám bùng thành lửa cam, số chuỗi nhảy lên
function streakScreen(oldN,newN,best,next){
  const week=[], dow=(new Date(vnDate()+'T00:00:00').getDay()+6)%7; // 0 = thứ Hai
  for(let k=0;k<7;k++){const off=k-dow, inStreak=off<=0&&off>-newN;
    week.push(`<div class="wd ${inStreak?(off===0?'today':'on'):''} ${off>0?'future':''}"><i>${off===0?'':inStreak?'✓':''}</i><span>${['T2','T3','T4','T5','T6','T7','CN'][k]}</span></div>`)}
  const record=newN>1&&newN>=best;
  openOv(`<div class="streak-stage" role="status" aria-live="polite">
    <div class="flame-wrap"><div class="glow"></div>${flameSVG(false,'f-gray')}${flameSVG(true,'f-lit')}
      <div class="sparks">${Array.from({length:14},(_,k)=>`<i style="--x:${Math.round((Math.random()-.5)*160)}px;--d:${(.7+Math.random()*.9).toFixed(2)}s;--s:${(4+Math.random()*5).toFixed(1)}px"></i>`).join('')}</div></div>
    <div class="streak-num"><b id="sNum">${oldN}</b></div>
    <h2>${newN===1?'Thắp lửa chuỗi mới!':`Chuỗi ${newN} ngày liên tiếp!`}</h2>
    ${record?'<div class="record">Kỷ lục mới của bạn</div>':''}
    <p class="muted">Ngày mai quay lại mở quán và chốt sổ ít nhất một lượt để giữ lửa. Bỏ một ngày là chuỗi về 0.</p>
    <div class="week">${week.join('')}</div>
    <button class="btn warm grow" id="sNext">Tiếp tục</button></div>`);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  sfx.streak();
  setTimeout(()=>{const n=$('sNum');if(n){n.textContent=newN;n.classList.add('pop');sfx.num()}},reduce?0:900);
  $('sNext').onclick=next;
}

let midClose=false;
async function finishRun(why, cashOut=false){
  midClose=cashOut;
  running=false; midRun=false;
  const lost=S.lost||0;
  const hs=DIFF[diff].hs;
  const est=Math.round(S.total*hs/10)-Math.round(lost*15*hs**2);
  const ov=$('ov'); showOv(true);
  const head=cashOut?`<div class="eyebrow">Chốt sổ · ${DIFF[diff].n}</div><h2>Nghỉ bán sau ${S.day} ngày</h2>`
                     :`<div class="eyebrow">Quán tạm đóng cửa · ${DIFF[diff].n}</div><h2>Trụ được ${S.day} ngày</h2>`;
  const summary=`<div class="sum"><span>Tổng doanh thu</span><b>${S.total}k</b><span>Tim đã mất</span><b>${lost}</b>
    <span>Thưởng (${S.total}k × ${hs} ÷ 10)</span><b>+${Math.round(S.total*hs/10)}</b>
    <span>Phạt (${lost} tim × ${phat(diff)})</span><b>−${Math.round(lost*15*hs**2)}</b></div>`;
  if(!ranked){
    if(S.day>guestBest.day||(S.day===guestBest.day&&S.total>guestBest.money)){guestBest={day:S.day,money:S.total};try{localStorage.setItem('mqbk-best',JSON.stringify(guestBest))}catch(e){}}
    const showGuest=()=>{openOv(`${head}<p>${esc(why)}</p>${summary}
      <p class="muted">Lượt chơi thử không được tính điểm. Nếu đăng nhập, lượt này sẽ ${est>=0?'cộng':'trừ'} <b>${Math.abs(est)}</b> ĐBK.</p>
      <div class="col grow"><button class="btn" id="again">Chơi lại</button><button class="btn ghost" id="home">Về màn hình chính</button></div>`);
      $('again').onclick=()=>startRun(); $('home').onclick=home};
    const before=streakState().n, g=bumpGuestStreak();
    const showG=()=>{showGuest();if(midClose){midClose=false;sfx.closeEnd()}};
    if(g.moi) streakScreen(before,g.chuoi,g.best,showG); else showG();
    return;
  }
  // Lưu kết quả trên máy trước khi gửi, để không mất nếu mạng lỗi
  const pend={uid:user.id,run:runId,so_ngay:S.day,doanh_thu:S.total,tim_mat:lost};
  savePending(pend); runId=null;
  const trySubmit=async()=>{
    ov.innerHTML=`${head}<p>${esc(why)}</p>${summary}<div class="submitting" id="msg"><span class="coin" aria-hidden="true"></span>Đang nộp điểm…</div>`;
    submitting=true; if(cashOut) sfx.countStart();
    const [{data,error}]=await Promise.all([submitPending(pend), new Promise(r=>setTimeout(r,cashOut?800:0))]);
    submitting=false; sfx.countStop();
    if(error&&cashOut) sfx.closeFail();
    if(error&&!isNetErr(error)){
      ov.innerHTML=`${head}${summary}<div class="msg">Không nộp được điểm: ${esc(error.message)}</div>
        <div class="col grow"><button class="btn" id="home">Về màn hình chính</button></div>`;
      $('home').onclick=home; return;
    }
    if(error){
      ov.innerHTML=`${head}${summary}<div class="msg">Chưa nộp được điểm do mạng chập chờn.</div>
        <p class="muted">Kết quả đã được lưu trên máy này. Bấm thử lại, hoặc lần sau mở game trên máy này sẽ tự nộp. Lượt này không bị tính là bỏ dở.</p>
        <div class="col grow"><button class="btn" id="retry">Thử nộp lại</button><button class="btn ghost" id="home">Về màn hình chính</button></div>`;
      $('retry').onclick=trySubmit; $('home').onclick=home; return;
    }
    if(data&&data.chuoi_moi){
      const before=streakState().n;
      if(profile){profile.chuoi=data.chuoi;profile.ngay_chuoi=vnDate();profile.chuoi_dai_nhat=data.chuoi_dai_nhat}
      const go=()=>streakScreen(before,data.chuoi,data.chuoi_dai_nhat,()=>{openOv('');showResult(head,why,summary,data)});
      go();
    } else showResult(head,why,summary,data);
  };
  trySubmit();
}
function showResult(head,why,summary,data){
  if(midClose){midClose=false;sfx.closeEnd()}
  const ov=$('ov');
  if(profile) profile.diem=data.diem; myRank=data.hang;
  const d=data.delta;
  ov.innerHTML=`${head}<p>${esc(why)}</p>
    <div><div class="eyebrow">Điểm Bách Khoa</div>
      <div class="big pop-in" style="color:${d==null||d>=0?'var(--leaf)':'var(--chili)'}">${d==null?'Đã ghi nhận':(d>=0?'+':'−')+Math.abs(d)}</div>
      <p class="muted">Bây giờ bạn có <b>${data.diem}</b> ĐBK, hạng <b>#${data.hang}</b> toàn trường.</p></div>
    ${summary}
    <div class="col grow"><button class="btn" id="again">Chơi lượt mới</button>
      <button class="btn ghost" id="lb">Xem bảng xếp hạng</button><button class="link" id="home">Về màn hình chính</button></div>`;
  $('again').onclick=()=>startRun(); $('lb').onclick=()=>leaderboard('sv'); $('home').onclick=home;
}

function viErr(m){
  if(/should be different/i.test(m)) return 'Mật khẩu mới phải khác mật khẩu cũ.';
  if(/session missing|expired|invalid.*(link|token)/i.test(m)) return 'Link đã hết hạn hoặc đã dùng rồi. Hãy gửi lại link mới.';
  if(/Invalid login/i.test(m)) return 'Sai email hoặc mật khẩu.';
  if(/not confirmed/i.test(m)) return 'Email chưa được xác nhận. Kiểm tra hộp thư (cả mục Spam).';
  if(/already registered/i.test(m)) return 'Email này đã có tài khoản, hãy đăng nhập.';
  if(/rate limit/i.test(m)) return 'Hệ thống đang quá tải email, thử lại sau ít phút.';
  return m;
}

const AV_BASE=SB_URL+'/storage/v1/object/public/avatars/';
const avColor=s=>['#1B3A6B','#6B4A2B','#C8321E','#5A6270','#2F6B3A','#7B3F8C','#B5651D','#2E7D7A','#8A2E4B'][[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%9];
const initials=s=>String(s||'?').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();
function avatarHTML(url,name,size=36,cls=''){
  return url?`<img class="av ${cls}" src="${esc(url)}" alt="" width="${size}" height="${size}" loading="lazy" style="width:${size}px;height:${size}px">`
    :`<span class="av av-txt ${cls}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:${avColor(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>no(new Error('Không mở được ảnh'));i.src=src})}
function canvasBlob(cv,q=.88){return new Promise(ok=>cv.toBlob(ok,'image/jpeg',q))}
// Ảnh gốc thu nhỏ tối đa 1080px để lưu nhẹ, giữ lại để chỉnh khung sau này
async function shrink(file){
  const url=URL.createObjectURL(file); try{
    const img=await loadImg(url), k=Math.min(1,1080/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); return cv;
  } finally {URL.revokeObjectURL(url)}
}
function pickFile(){return new Promise(ok=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>ok(f.files[0]||null);f.click()})}
async function chooseAvatar(){
  const file=await pickFile(); if(!file) return;
  if(!/^image\//.test(file.type)){toast('Hãy chọn một file ảnh');return}
  try{const cv=await shrink(file); avatarEditor(cv,{x:.5,y:.5,z:1},true)}catch(e){toast('Không mở được ảnh này, thử ảnh khác')}
}
async function readjustAvatar(){
  const k=profile&&profile.avatar_khung; if(!k){chooseAvatar();return}
  toast('Đang mở ảnh gốc…');
  try{const img=await loadImg(AV_BASE+user.id+'/goc.jpg?v='+(k.v||0)); avatarEditor(img,k,false)}
  catch(e){toast('Không tải được ảnh gốc, hãy chọn lại ảnh')}
}
// Trình cắt: kéo để di chuyển, thanh trượt / lăn chuột / chụm 2 ngón để phóng to
function avatarEditor(src,khung,isNew){
  const W=src.naturalWidth||src.width, H=src.naturalHeight||src.height, M=Math.min(W,H);
  const st={x:khung.x??.5,y:khung.y??.5,z:Math.min(4,Math.max(1,khung.z??1))};
  openOv(`<div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">Avatar</div><button class="link" id="cancel">Huỷ</button></div>
  <h2>Căn khung avatar</h2>
  <p class="muted">Kéo ảnh để chọn phần nằm trong vòng tròn, kéo thanh trượt để phóng to hoặc thu nhỏ.</p>
  <div class="crop" id="crop"><canvas id="cv"></canvas><div class="ring"></div></div>
  <label class="zoom">Thu nhỏ<input type="range" id="zm" min="1" max="4" step="0.01" value="${st.z}" aria-label="Phóng to">Phóng to</label>
  <div class="msg" id="msg"></div>
  <div class="col grow"><button class="btn" id="save">Lưu avatar</button><button class="btn ghost" id="other">Chọn ảnh khác</button></div>`);
  const box=$('crop'), cv=$('cv'), ctx=cv.getContext('2d');
  const size=()=>box.clientWidth, dpr=Math.min(2,devicePixelRatio||1);
  const clamp=()=>{const h=M/st.z/2; st.x=Math.min(1-h/W,Math.max(h/W,st.x)); st.y=Math.min(1-h/H,Math.max(h/H,st.y))};
  const rect=()=>{const s=M/st.z; return [st.x*W-s/2, st.y*H-s/2, s, s]};
  const draw=()=>{const V=size(); cv.width=V*dpr; cv.height=V*dpr; clamp(); const [sx,sy,sw,sh]=rect();
    ctx.imageSmoothingQuality='high'; ctx.drawImage(src,sx,sy,sw,sh,0,0,cv.width,cv.height)};
  draw(); addEventListener('resize',draw);
  const pts=new Map(); let pinch=0;
  box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});
  box.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const pr=pts.get(e.pointerId);
    if(pts.size===1){const k=M/st.z/size(); st.x-=(e.clientX-pr.x)*k/W; st.y-=(e.clientY-pr.y)*k/H}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch) st.z=Math.min(4,Math.max(1,st.z*d/pinch)); pinch=d; $('zm').value=st.z}
    draw()});
  const up=e=>{pts.delete(e.pointerId);pinch=0};
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
  box.addEventListener('wheel',e=>{e.preventDefault();st.z=Math.min(4,Math.max(1,st.z*(e.deltaY<0?1.08:.93)));$('zm').value=st.z;draw()},{passive:false});
  $('zm').oninput=e=>{st.z=+e.target.value;draw()};
  const leave=()=>{removeEventListener('resize',draw);profileScreen()};
  $('cancel').onclick=leave;
  $('other').onclick=()=>{removeEventListener('resize',draw);chooseAvatar()};
  $('save').onclick=async()=>{
    const msg=$('msg'); msg.className='msg ok'; msg.textContent='Đang lưu avatar…'; $('save').disabled=true;
    try{
      const v=isNew?Date.now():(khung.v||Date.now());
      const out=document.createElement('canvas'); out.width=out.height=256; const [sx,sy,sw,sh]=rect();
      const o=out.getContext('2d'); o.imageSmoothingQuality='high'; o.drawImage(src,sx,sy,sw,sh,0,0,256,256);
      const bucket=sb.storage.from('avatars');
      if(isNew){const g=await bucket.upload(user.id+'/goc.jpg',await canvasBlob(src.tagName==='CANVAS'?src:out,.85),{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'});if(g.error)throw g.error}
      const a=await bucket.upload(user.id+'/avatar.jpg',await canvasBlob(out,.9),{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'}); if(a.error) throw a.error;
      const url=AV_BASE+user.id+'/avatar.jpg?v='+Date.now(), k={x:+st.x.toFixed(4),y:+st.y.toFixed(4),z:+st.z.toFixed(3),v};
      const r=await sb.rpc('luu_avatar',{p_url:url,p_khung:k}); if(r.error) throw r.error;
      profile.avatar_url=url; profile.avatar_khung=k; toast('Đã lưu avatar'); leave();
    }catch(e){msg.className='msg';msg.textContent='Chưa lưu được: '+(e.message||e);$('save').disabled=false}
  };
}
async function removeAvatar(){
  const r=await sb.rpc('luu_avatar',{p_url:null,p_khung:null});
  if(r.error){toast('Chưa xoá được, thử lại');return}
  sb.storage.from('avatars').remove([user.id+'/goc.jpg',user.id+'/avatar.jpg']);
  profile.avatar_url=null; profile.avatar_khung=null; toast('Đã xoá avatar'); profileScreen();

/* ================= Kéo xuống để tải lại (chỉ khi không đang trong lượt chơi) ================= */
(function pullToRefresh(){
  const ov=$('ov'), ind=$('ptr'), PULL=80;
  let y0=null, dy=0;
  const setInd=(d)=>{const t=Math.min(d,110);ind.style.transform=`translateY(${t*.6-8}px)`;ind.style.opacity=Math.min(1,d/PULL);ind.classList.toggle('ready',d>=PULL)};
  const reset=()=>{y0=null;dy=0;ind.style.transition='transform .2s, opacity .2s';setInd(0);setTimeout(()=>ind.style.transition='',220)};
  ov.addEventListener('touchstart',e=>{
    if(midRun||running||submitting||ov.scrollTop>0||e.touches.length!==1){y0=null;return}
    y0=e.touches[0].clientY; dy=0; ind.style.transition='';
  },{passive:true});
  ov.addEventListener('touchmove',e=>{
    if(y0==null) return;
    if(ov.scrollTop>0){reset();return}
    dy=Math.max(0,(e.touches[0].clientY-y0)*.55); setInd(dy);
  },{passive:true});
  ov.addEventListener('touchend',()=>{
    if(y0==null) return;
    if(dy>=PULL&&!midRun&&!running){ind.classList.remove('ready');ind.classList.add('spin');ind.style.transform='translateY(40px)';ind.style.opacity=1;setTimeout(()=>location.reload(),150)}
    else reset();
  });
  ov.addEventListener('touchcancel',reset);
})();

const tenNgan=s=>String(s||'').trim().split(/\s+/).pop()||'Đối thủ';
const HEART_PATH='M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 5-4 8.5-11 14z';

/* ---- kết nối realtime: lời thách tới, cập nhật trận, ai đang online ---- */
function soloConnect(){
  if(!sb||!user||soloCh) return;
  soloCh=sb.channel('solo-'+user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'thach_dau'},p=>soloRow(p.new))
    .subscribe();
  onlineCh=sb.channel('online',{config:{presence:{key:user.id}}});
  onlineCh.on('presence',{event:'sync'},()=>{
      onlineSet=new Set(Object.keys(onlineCh.presenceState()));
      document.querySelectorAll('[data-online]').forEach(el=>el.hidden=!onlineSet.has(el.dataset.online))})
    .subscribe(s=>{if(s==='SUBSCRIBED') onlineCh.track({at:Date.now()})});
  soloPoll(true); clearInterval(soloConnect.t); soloConnect.t=setInterval(()=>soloPoll(false),15000);
}
function soloDisconnect(){
  if(soloCh){sb.removeChannel(soloCh);soloCh=null}
  if(onlineCh){sb.removeChannel(onlineCh);onlineCh=null}
  clearInterval(soloConnect.t); [...notices.keys()].forEach(dropNotice);
}
// Dự phòng khi realtime chập chờn: hỏi server lời thách đang chờ; trận cũ còn treo (tải lại trang giữa trận) thì tính bỏ trận
async function soloPoll(boot){
  if(!sb||!user) return;
  const {data}=await sb.from('thach_dau').select('*').or(`a.eq.${user.id},b.eq.${user.id}`)
    .in('trang_thai',['cho','dang_dau']).order('id',{ascending:false}).limit(10);
  (data||[]).forEach(r=>{
    if(r.trang_thai==='cho'){ if(r.b===user.id&&new Date(r.het_han)>Date.now()) soloRow(r); else if(boot&&r.a===user.id) sb.rpc('huy_thach_dau',{p_id:r.id}); return }
    const mine=(solo&&solo.id===r.id)||(soloWait&&soloWait.id===r.id)||soloAccepting===r.id;
    if(!mine&&new Date(r.bat_dau)<Date.now()-10000)
      sb.rpc('bo_tran_solo',{p_id:r.id}).then(()=>toast('Trận solo trước bị tính thua vì bạn rời trận'));
  });
}
function soloRow(r){
  if(!r||!user) return;
  const mine=r.a===user.id?'a':r.b===user.id?'b':null; if(!mine) return;
  if(mine==='b'&&r.trang_thai==='cho'){ if(!notices.has(r.id)&&new Date(r.het_han)>Date.now()) showNotice(r); return }
  if(notices.has(r.id)) dropNotice(r.id);
  if(soloWait&&soloWait.id===r.id){
    if(r.trang_thai==='dang_dau') return startSolo(r,soloWait.opp);
    if(['tu_choi','het_han','huy'].includes(r.trang_thai)) return waitEnded(r);
  }
  if(solo&&solo.id===r.id) soloUpdate(r);
}

/* ---- thông báo thách đấu ở góc dưới bên phải ---- */
const TITLE0=document.title;
function titleBlink(on){clearInterval(titleBlink.t);document.title=TITLE0;if(!on)return;let k=0;
  titleBlink.t=setInterval(()=>{document.title=(k++%2)?TITLE0:'(!) Có lời thách đấu'},1000)}
const soloBusy=()=>midRun||!!solo||!!soloWait;
async function showNotice(r){
  notices.set(r.id,{row:r});                      // giữ chỗ để không hiện hai lần
  const {data:p}=await sb.from('profiles').select('id,ten,lop,khoa_id,elo,avatar_url').eq('id',r.a).maybeSingle();
  if(!notices.has(r.id)) return;
  const left=Math.max(0,new Date(r.het_han)-Date.now());
  let box=$('notices');
  if(!box){box=document.createElement('div');box.id='notices';box.className='notices';box.setAttribute('aria-live','assertive');document.body.appendChild(box)}
  const el=document.createElement('div'); el.className='notice'; el.setAttribute('role','alertdialog'); el.setAttribute('aria-label','Lời thách đấu');
  el.innerHTML=`${avatarHTML(p?.avatar_url,p?.ten||'?',44)}
    <div class="t">${esc(p?.ten||'Một người chơi')} thách đấu bạn!</div>
    <div class="d">${esc(p?.lop||'')} · Elo ${p?.elo??'—'} · ${DIFF[r.do_kho].n} · ${CHE_DO[r.che_do].n}</div>
    <div class="note" hidden>Bạn đang chơi dở, chốt sổ xong mới nhận được.</div>
    <div class="timer"><i style="animation-duration:${left}ms"></i></div>
    <div class="acts2"><button type="button" class="btn ghost" data-no>Từ chối</button><button type="button" class="btn" data-yes>Đồng ý</button></div>`;
  box.appendChild(el);
  Object.assign(notices.get(r.id),{el,p,timer:setTimeout(()=>dropNotice(r.id),left)});
  refreshNotices();
  sfx.challenge(); try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
  titleBlink(true);
  el.querySelector('[data-no]').onclick=()=>answer(r.id,false);
  el.querySelector('[data-yes]').onclick=()=>answer(r.id,true);
}
function refreshNotices(){
  const busy=soloBusy();
  notices.forEach(n=>{if(!n.el)return;n.el.querySelector('[data-yes]').disabled=busy;n.el.querySelector('.note').hidden=!busy});
}
function dropNotice(id){
  const n=notices.get(id); notices.delete(id); if(!n) return;
  clearTimeout(n.timer); if(n.el){n.el.classList.add('out');setTimeout(()=>n.el.remove(),250)}
  if(!notices.size) titleBlink(false);
}
async function answer(id,yes){
  const n=notices.get(id); if(!n||!n.el) return;
  if(yes&&soloBusy()){toast('Bạn đang chơi dở');return}
  n.el.querySelectorAll('button').forEach(b=>b.disabled=true);
  if(yes) soloAccepting=id;
  const {data,error}=await sb.rpc('tra_loi_thach_dau',{p_id:id,p_dong_y:yes});
  dropNotice(id);
  if(error){soloAccepting=null;toast(error.message);return}
  if(yes&&data?.trang_thai==='dang_dau'){[...notices.keys()].forEach(dropNotice);startSolo(data,n.p)}
  soloAccepting=null;
}

    <p class="muted">Mỗi người bán 3 ngày cùng lúc, có cửa hàng giữa các ngày, không mua lại tim. Thắng <b>+${win}</b> Elo, thua <b>${lose}</b> Elo. Solo không cộng trừ ĐBK.</p>

  $('sModes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;md=b.dataset.m;$('sModes').querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===md))};

    if(error){msg.className='msg';msg.textContent=error.message;$('send').disabled=false;return}

function waitScreen(w){
  soloWait=w; refreshNotices(); const end=Date.now()+60000;
  openOv(`<div class="eyebrow">Solo · ${DIFF[w.dk].n} · ${CHE_DO[w.md].n}</div><h2>Đang chờ ${esc(tenNgan(w.opp.ten))} trả lời</h2>
    ${vsHTML(w.opp)}
    <p class="muted">Lời thách hiện ở góc màn hình của ${esc(w.opp.ten)}, kèm âm thanh.${onlineSet.has(w.opp.id)?'':' Bạn ấy có vẻ không mở game lúc này nên có thể không thấy.'}</p>
    <div class="submitting"><span class="coin" aria-hidden="true"></span>Còn <span id="wLeft">60</span> giây</div>
    <div class="col grow"><button class="btn ghost" id="cancel">Huỷ lời thách</button></div>`);
  $('cancel').onclick=async()=>{if(soloWait!==w)return;soloWait=null;clearInterval(w.t);refreshNotices();await sb.rpc('huy_thach_dau',{p_id:w.id});home()};
  w.t=setInterval(async()=>{
    if(soloWait!==w){clearInterval(w.t);return}
    const s=Math.max(0,Math.ceil((end-Date.now())/1000)), el=$('wLeft'); if(el) el.textContent=s;
    if(s%3===0||s===0){const {data}=await sb.rpc('kiem_tra_solo',{p_id:w.id}); if(data&&soloWait===w) soloRow(data)}
  },1000);
}
function waitEnded(r){
  const w=soloWait; soloWait=null; clearInterval(w.t); refreshNotices();
  const why=r.trang_thai==='tu_choi'?`${w.opp.ten} đã từ chối lời thách.`
    :r.trang_thai==='het_han'?`${w.opp.ten} không trả lời trong 60 giây.`:'Lời thách đã bị huỷ.';
  if(r.trang_thai==='tu_choi') sfx.wrong();
  openOv(`<div class="eyebrow">Solo</div><h2>Chưa đấu được</h2><p>${esc(why)}</p>
    <div class="col grow"><button class="btn" id="again">Thách lại</button><button class="btn ghost" id="lbs">Tìm người khác</button><button class="link" id="home">Về màn hình chính</button></div>`);
  $('again').onclick=()=>challengeScreen(w.opp,null,{dk:w.dk,md:w.md}); $('lbs').onclick=()=>leaderboard('solo',true); $('home').onclick=home;
}

/* ---- trận đấu ---- */
function startSolo(r,opp){
  if(solo&&solo.id===r.id) return;
  if(soloWait){clearInterval(soloWait.t);soloWait=null}
  const me=r.a===user.id?'a':'b';
  solo={id:r.id,me,op:me==='a'?'b':'a',row:r,opp:opp||{ten:'Đối thủ'},dk:r.do_kho,md:r.che_do,prevDiff:diff,sent:'',last:0};
  diff=r.do_kho; midRun=true; refreshNotices();
  if(!opp||!opp.ten||opp.elo==null) sb.from('profiles').select('id,ten,lop,elo,avatar_url').eq('id',r[solo.op]).maybeSingle()
    .then(({data})=>{if(data&&solo&&solo.id===r.id){solo.opp=data;if(running)renderStats()}});
  let n=Math.round((new Date(r.bat_dau)-Date.now())/1000); if(!(n>=1)) n=3; n=Math.min(4,n);
  openOv(`<div class="eyebrow" style="text-align:center">Solo · ${DIFF[solo.dk].n} · ${CHE_DO[solo.md].n}</div>
    ${vsHTML(solo.opp)}<div class="countdown pop-in" id="cd">${n}</div>
    <p class="muted" style="text-align:center;margin-inline:auto">${CHE_DO[solo.md].d}</p>`);
  sfx.num();
  const t=setInterval(()=>{ if(!solo||solo.id!==r.id){clearInterval(t);return}
    n--; const cd=$('cd'); if(n>0){if(cd){cd.textContent=n;cd.classList.remove('pop-in');void cd.offsetWidth;cd.classList.add('pop-in')}sfx.num()}
    else {clearInterval(t);sfx.cash(true);soloBegin()}},1000);
}
function soloBegin(){
  if(!solo) return;
  S={day:1,money:0,rep:5,upg:{},total:0,lost:0,bought:0}; startDay();
  solo.ping=setInterval(()=>soloPush(true),4000);
  solo.chk=setInterval(async()=>{if(!solo)return;const id=solo.id;const {data}=await sb.rpc('kiem_tra_solo',{p_id:id});if(data&&solo&&solo.id===id)soloUpdate(data)},10000);
}
// Gửi tiến độ của mình (gọi sau mỗi lần đổi tiền/tim, tối đa ~1,4 lần/giây, và mỗi 4 giây để báo còn online)
async function soloPush(force=false,xong=false){
  if(!solo) return;
  const key=[S.day,S.total,S.lost,xong].join();
  if(!force&&key===solo.sent) return;
  if(!force&&Date.now()-solo.last<700){clearTimeout(solo.tt);solo.tt=setTimeout(()=>soloPush(),700);return}
  solo.sent=key; solo.last=Date.now();
  const id=solo.id;
  const {data,error}=await sb.rpc('cap_nhat_solo',{p_id:id,p_ngay:Math.min(SOLO_NGAY,S.day),p_doanh_thu:S.total,p_tim_mat:Math.min(5,S.lost),p_xong:xong});
  if(!solo||solo.id!==id) return;
  if(data) soloUpdate(data);
  else if(error&&xong) setTimeout(()=>soloPush(true,true),1500);   // mạng lỗi lúc báo xong: thử lại
}
function soloUpdate(r){
  if(!solo||r.id!==solo.id) return;
  const prev=solo.row, o=solo.op; solo.row=r;
  if(r.trang_thai==='xong') return soloEnd(r);
  if(running){
    if(prev&&(r[o+'_tim_mat']||0)>(prev[o+'_tim_mat']||0)) toast(`${tenNgan(solo.opp.ten)} vừa mất 1 tim`);
    renderStats();
  }
  const os=$('oppShop'); if(os) os.innerHTML=oppLine();
  const ow=$('oppNow'); if(ow) ow.innerHTML=oppLine();
}
const oppLine=()=>{if(!solo)return'';const r=solo.row,o=solo.op,t=r[o+'_tim_mat']||0;
  return `<b>${esc(tenNgan(solo.opp.ten))}</b>: ngày ${Math.max(1,r[o+'_ngay']||1)}, ${r[o+'_doanh_thu']||0}k, mất ${t} tim, ${diemSolo(solo.dk,r[o+'_doanh_thu']||0,t)} ĐBK${r[o+'_xong']?' · đã xong':''}`};
// Thanh đối thủ hiện trong dòng sự kiện khi đang bán
function soloHud(){
  if(!solo) return '';
  const r=solo.row, o=solo.op, t=Math.min(5,r[o+'_tim_mat']||0);
  const hp=i=>`<svg viewBox="0 0 24 22" aria-hidden="true"><path d="${HEART_PATH}" fill="${i<5-t?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/></svg>`;
  return `<span class="opp" aria-label="Đối thủ ${esc(solo.opp.ten)}: ${r[o+'_doanh_thu']||0}k, còn ${5-t} tim">${avatarHTML(solo.opp.avatar_url,solo.opp.ten,20)}<b>${esc(tenNgan(solo.opp.ten))}</b>
    <span>N${Math.max(1,r[o+'_ngay']||1)} · ${r[o+'_doanh_thu']||0}k</span><span class="hearts">${[0,1,2,3,4].map(hp).join('')}</span>${r[o+'_xong']?'<span>· xong</span>':''}</span>`;
}
function soloShop(){
  showShop();
  const cash=$('cash'), nx=$('next'); let armed=false, s=SOLO_SHOP;
  cash.textContent='Bỏ trận (tính thua)';
  cash.onclick=async()=>{ if(!armed){armed=true;cash.textContent='Bấm lần nữa để bỏ trận';return}
    clearInterval(t); cash.disabled=true; const {data}=await sb.rpc('bo_tran_solo',{p_id:solo.id}); if(data) soloUpdate(data) };
  nx.insertAdjacentHTML('beforebegin',`<p class="muted" id="oppShop">${oppLine()}</p>`);
  const lbl=()=>nx.textContent=`Mở quán ngày ${S.day+1} · ${s}s`;
  const go=nx.onclick; nx.onclick=()=>{clearInterval(t);go()};
  lbl(); const t=setInterval(()=>{ if(!solo){clearInterval(t);return} s--; if(s<=0){clearInterval(t);nx.onclick()} else lbl()},1000);
}
function soloFinish(why){
  running=false; if(!solo) return;
  solo.why=why; soloPush(true,true);
  const my=diemSolo(solo.dk,S.total,Math.min(5,S.lost));
  openOv(`<div class="eyebrow">Solo · ${DIFF[solo.dk].n} · ${CHE_DO[solo.md].n}</div><h2>${esc(why)}</h2>
    <div class="sum"><span>Doanh thu của bạn</span><b>${S.total}k</b><span>Tim đã mất</span><b>${Math.min(5,S.lost)}</b><span>ĐBK của bạn</span><b>${my}</b></div>
    <div class="submitting"><span class="coin" aria-hidden="true"></span>Đang chờ đối thủ…</div>
    <p class="muted" id="oppNow">${oppLine()}</p>`);
}
function soloEnd(r){
  if(!solo) return;
  const s=solo; solo=null; document.querySelectorAll('.toast').forEach(t=>t.remove());
  running=false; midRun=false; clearInterval(s.ping); clearInterval(s.chk); clearTimeout(s.tt);
  diff=s.prevDiff;
  const me=s.me, o=s.op, draw=!r.thang, win=r.thang===user.id, d=r['doi_'+me]??0, eloMoi=(r['elo_'+me]??myElo())+d;

  const why={het_tim:win?`${ten} hết tim trước.`:draw?'Hai bạn hết tim cùng lúc.':'Bạn hết tim trước.',
    diem:draw?'Hai bạn bằng điểm sau 3 ngày.':'So ĐBK sau 3 ngày bán.',
    roi_tran:win?`${ten} đã rời trận quá lâu nên bị xử thua.`:'Bạn mất kết nối quá lâu nên bị xử thua.',
    bo_cuoc:win?`${ten} đã bỏ trận.`:'Bạn đã bỏ trận.', ca_hai_roi:'Cả hai đều mất kết nối.'}[r.ly_do]||'';
  const cell=(k,x)=>`<td>${x}</td>`, dm=diemSolo(s.dk,r[me+'_doanh_thu'],r[me+'_tim_mat']), dt=diemSolo(s.dk,r[o+'_doanh_thu'],r[o+'_tim_mat']);
  openOv(`<div class="eyebrow">Solo · ${DIFF[s.dk].n} · ${CHE_DO[s.md].n}</div>
    <h2>${draw?'Hoà!':win?'Bạn thắng!':'Bạn thua rồi'}</h2><p>${esc(why)}</p>
    <div><div class="eyebrow">Elo solo</div>
      <div class="big pop-in" style="color:${d>0?'var(--leaf)':d<0?'var(--chili)':'var(--heading)'}">${d>0?'+':d<0?'−':'±'}${Math.abs(d)}</div>
      <p class="muted">Elo của bạn bây giờ là <b>${Math.max(100,eloMoi)}</b>.</p></div>
    <div class="sum" style="display:block"><table class="tb"><tr><th></th><th>Bạn</th><th>${esc(n)}</th></tr>
      <tr><td>Số ngày</td>${cell(0,r[me+'_ngay'])}${cell(0,r[o+'_ngay'])}</tr>
      <tr><td>Doanh thu</td>${cell(0,r[me+'_doanh_thu']+'k')}${cell(0,r[o+'_doanh_thu']+'k')}</tr>
      <tr><td>Tim đã mất</td>${cell(0,r[me+'_tim_mat'])}${cell(0,r[o+'_tim_mat'])}</tr>
      <tr><td>ĐBK</td>${cell(0,'<b>'+dm+'</b>')}${cell(0,'<b>'+dt+'</b>')}</tr></table></div>
    <div class="col grow"><button class="btn" id="re">Tái đấu</button><button class="btn ghost" id="lbs">Bảng xếp hạng Solo</button><button class="link" id="home">Về màn hình chính</button></div>`);
  if(win) sfx.closeEnd(); else if(draw) sfx.heart(); else sfx.closeFail();
  $('re').onclick=()=>challengeScreen({...s.opp,id:r[o]},null,{dk:s.dk,md:s.md});
  $('lbs').onclick=()=>leaderboard('solo'); $('home').onclick=home;
  refreshNotices();
}

/* ---- tìm người chơi ---- */
const lbPeople=new Map();
async function searchPlayers(q){
  const body=$('lbBody'); if(!body) return;
  body.innerHTML='<div class="empty-state">Đang tìm…</div>';
  const {data,error}=await sb.rpc('tim_nguoi_choi',{p_q:q});
  if(!$('q')||$('q').value.trim()!==q) return;
  if(error){body.innerHTML=`<div class="empty-state">${esc(error.message)}</div>`;return}
  if(!data||!data.length){body.innerHTML='<div class="empty-state">Không thấy ai có tên hoặc lớp này.</div>';return}
  const rows=[...data].sort((a,b)=>onlineSet.has(b.id)-onlineSet.has(a.id));
  rows.forEach(p=>lbPeople.set(p.id,p));
  body.innerHTML=`<div class="list">${rows.map(p=>`<div class="li"><span>${avatarHTML(p.avatar_url,p.ten,34)}</span>
    <span class="nm"><span class="dot" data-online="${p.id}" ${onlineSet.has(p.id)?'':'hidden'}></span>${esc(p.ten)}<span class="sb">${esc(p.lop)} · ${esc(p.khoa)} · Elo ${p.elo}</span></span>
    <button type="button" class="act" data-uid="${p.id}">Thách đấu</button></div>`).join('')}</div>
    <p class="muted"><span class="dot"></span>đang mở game</p>`;
}

/* ================= Thông báo đẩy khi có lời thách (Web Push) =================
   sw.js nhận push từ Edge Function thong-bao-thach-dau rồi hiện thông báo hệ thống,
   kể cả khi game đang đóng hoặc người chơi ở app khác. Bấm thông báo → mở game → hiện lời thách. */
const PUSH_PUB='BCE_Q504DzeGzAx28t2RdRpc_x7Ui_iMb0Pnzv9C9zGnJlZfnLL02fLD7A_0Eewy3-yCgaxjKTjyITecdDYc9tI';
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let swReg=null;
function pushSupport(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
async function swInit(){
  if(!('serviceWorker' in navigator)) return;
  try{ swReg=await navigator.serviceWorker.register('sw.js'); }catch(e){ swReg=null }
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='thach'){openThach(e.data.id)}});
}
// Trạng thái để vẽ nút: on | off | denied | ios | unsupported
async function pushState(){
  if(isIOS&&!isStandalone()) return 'ios';
  if(!pushSupport()) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  if(Notification.permission!=='granted') return 'off';
  const reg=swReg||await navigator.serviceWorker.ready.catch(()=>null);
  const sub=reg&&await reg.pushManager.getSubscription().catch(()=>null);
  return sub?'on':'off';
}
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const key64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function saveSub(sub){
  const {error}=await sb.rpc('luu_push',{p_endpoint:sub.endpoint,p_p256dh:key64(sub.getKey('p256dh')),p_auth:key64(sub.getKey('auth'))});
  if(error) throw error;
}
// Gọi từ nút bấm (trình duyệt chỉ cho xin quyền khi người dùng bấm)
async function enablePush(){
  if(!ranked){toast('Đăng nhập để nhận thông báo');return false}
  const st=await pushState();
  if(st==='ios'){iosGuide();return false}
  if(st==='unsupported'){toast('Trình duyệt này chưa hỗ trợ thông báo');return false}
  if(st==='denied'){deniedGuide();return false}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast(perm==='denied'?'Bạn đã chặn thông báo':'Chưa bật thông báo');return false}
    const reg=swReg||await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_PUB)});
    await saveSub(sub);
    try{localStorage.removeItem('mqbk-push-later')}catch(e){}
    sfx.heart(); toast('Đã bật thông báo thách đấu');
    return true;
  }catch(e){toast('Không bật được: '+(e.message||e));return false}
}
async function disablePush(){
  try{const reg=swReg||await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub){await sb.rpc('xoa_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){}
  toast('Đã tắt thông báo trên máy này');
}
// Sau khi đăng nhập: máy đã cho phép rồi thì gắn đăng ký vào tài khoản này (âm thầm)
async function pushResync(){
  if(!ranked||!pushSupport()||Notification.permission!=='granted') return;
  try{const reg=swReg||await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_PUB)});
    await saveSub(sub)}catch(e){}
}
async function pushUnlink(){ // đăng xuất: máy này thôi nhận thông báo của tài khoản cũ
  try{const reg=swReg||await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub) await sb.rpc('xoa_push',{p_endpoint:sub.endpoint})}catch(e){}
}
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
// Thẻ mời bật thông báo trên màn chính (ẩn nếu đã bật hoặc bấm "Để sau" trong 7 ngày)
async function pushCard(){
  const slot=$('pushSlot'); if(!slot||!ranked) return;
  const st=await pushState();
  let later=0; try{later=+localStorage.getItem('mqbk-push-later')||0}catch(e){}
  if(st==='on'||st==='unsupported'||Date.now()-later<7*864e5){slot.innerHTML='';return}
  const txt=st==='ios'?'Trên iPhone, thêm game vào Màn hình chính để nhận thông báo khi bạn bè thách đấu.'
    :st==='denied'?'Thông báo đang bị chặn nên bạn sẽ lỡ lời thách khi không mở game.'
    :'Nhận thông báo khi bạn bè thách đấu, kể cả lúc không mở game.';
  slot.innerHTML=`<div class="push-card">${BELL}<span>${txt}</span>
    <button type="button" class="btn warm" id="pushOn">${st==='ios'?'Xem cách làm':st==='denied'?'Cách mở lại':'Bật thông báo'}</button>
    <button type="button" class="link" id="pushLater">Để sau</button></div>`;
  $('pushOn').onclick=async()=>{if(await enablePush()) slot.innerHTML=''};
  $('pushLater').onclick=()=>{try{localStorage.setItem('mqbk-push-later',Date.now())}catch(e){};slot.innerHTML=''};
}

// Mở từ thông báo (?thach=id hoặc tin nhắn từ sw.js): hiện lời thách nếu còn hạn
let pendingThach=null;
async function openThach(id){
  if(!id) return;
  if(!user){pendingThach=id;return}
  window.focus();
  await soloPoll(false);
  if(notices.has(+id)) return;
  const {data}=await sb.from('thach_dau').select('id,trang_thai,het_han').eq('id',id).maybeSingle();
  if(!data||data.trang_thai!=='cho'||new Date(data.het_han)<Date.now()) toast('Lời thách này đã hết hạn hoặc bị huỷ');
}

(function readLink(){

    :q.get('error_description').replace(/\+/g,' ');

const cleanUrl=()=>{try{history.replaceState(null,'',BACK_URL)}catch(e){}};
applyTheme(theme);

(async function boot(){
  if(!sb){ranked=false;home();return}
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){recovering=true;user=session?.user||user;setTimeout(()=>{cleanUrl();newPasswordScreen()},0)}
  });
  openOv('<div class="empty-state">Đang mở quán…</div>');
  countVisit();
  try{
    await loadKhoa();
    const {data:{session}}=await sb.auth.getSession();
    user=session?.user||null;
    if(/access_token|error_description/.test(location.hash)) cleanUrl();
    if(recovering&&user){newPasswordScreen();return}
    if(user){ await afterLogin(); if(justConfirmed) toast('Đã xác nhận email, chào mừng bạn'); } else authScreen();
  }catch(e){ranked=false;home();toast('Không kết nối được máy chủ, đang chơi thử')}
})();
