<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mì Quảng Bách Khoa</title>
<meta name="description" content="Game quán mì Quảng trước cổng Bách Khoa Đà Nẵng. Đua điểm theo lớp, theo khoa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone game — status strip, customer tables, bowl as hero, ingredient pad at thumb height; overlays for account, difficulty and rankings */
:root{
  color-scheme: light;
  --navy:#1B3A6B; --turmeric:#E8A317; --chili:#C8321E; --leaf:#2F6B3A;
  --paper:#FBF3E3; --ink:#2A2118; --muted:#7A6A55; --line:#E6D6B8; --card:#FFFDF8; --soft:#FFF4D6;
  --gold:#C99A1E; --silver:#8C96A3; --bronze:#A8663A;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;position:relative;user-select:none;-webkit-user-select:none}

.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat.time b{color:var(--chili)}
.hearts{color:var(--chili);letter-spacing:1px}
.event{font-size:12px;font-weight:700;color:var(--navy);text-align:center;margin-top:-4px}
.event .tag{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;margin-right:4px;font-size:11px}

.tables{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),1fr)}
.cust{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:7px 6px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;min-height:132px;cursor:pointer;position:relative;transition:transform .12s;min-width:0}
.cust:active{transform:scale(.96)}
.cust.empty{border-style:dashed;justify-content:center;color:var(--muted);font-size:12px;cursor:default;background:transparent}
.cust.teacher{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:12px;font-weight:800;line-height:1}
.who{font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.order{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:var(--paper);border-radius:8px;padding:3px}
.order svg{width:20px;height:20px}
.pat{width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:auto}
.pat i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.quote{font-size:10px;color:var(--muted);text-align:center;line-height:1.25;font-style:italic}

.station{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#bowl{width:100%;max-width:300px;height:auto;max-height:100%}
.hint{font-size:13px;font-weight:600;color:var(--muted);text-align:center;min-height:18px}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ing{font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
.ing svg{width:30px;height:30px}
.ing span{font-size:11px;font-weight:700}
.ing.on{border-color:var(--turmeric);background:var(--soft)}
.ing:active{transform:scale(.94)}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{font:inherit;font-family:var(--display);font-weight:800;font-size:17px;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;color:#fff;background:var(--navy);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.pour{background:var(--chili)}
.btn.warm{background:var(--turmeric);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.link{font:inherit;background:none;border:0;color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}

/* overlays */
.ov{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;gap:14px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px;z-index:5;overflow-y:auto;user-select:text;-webkit-user-select:text}
.ov > *{flex-shrink:0}
.ov .grow{margin-top:auto}
.ov h1{font-family:var(--display);font-weight:800;font-size:42px;line-height:.95;margin:0;color:var(--navy);text-wrap:balance}
.ov h1 em{font-style:normal;color:var(--turmeric);display:block}
.ov h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.05;color:var(--navy);text-wrap:balance}
.ov p{margin:0;line-height:1.5;max-width:60ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--chili)}
.steps{margin:0;padding-left:20px;line-height:1.6;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.msg{font-size:13px;font-weight:600;min-height:18px;color:var(--chili)}
.msg.ok{color:var(--leaf)}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1}
label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}

.me{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.me .nm{font-weight:700;font-size:16px}
.me .sub{font-size:12px;opacity:.8}
.me .pts{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.me .pts small{display:block;font-family:var(--body);font-size:11px;opacity:.8;font-weight:600}

.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.diff b{font-family:var(--display);font-size:17px;line-height:1}
.diff .x{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.diff small{font-size:11px;color:var(--muted);line-height:1.3}
.diff[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--soft)}
.diff.d-dianguc .x{color:var(--chili)}
.diff.d-kho .x{color:var(--turmeric)}
.diff.d-thuong .x{color:var(--leaf)}

.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.up strong{font-size:14px}
.up small{grid-column:1;color:var(--muted);font-size:12px}
.up button{grid-row:1/3;grid-column:2;font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:8px 12px;background:var(--turmeric);color:var(--ink);cursor:pointer}
.up button:disabled{background:var(--line);color:var(--muted)}

/* bảng xếp hạng */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;border-radius:9px;padding:8px 4px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--card);border:1.5px solid var(--line);border-radius:12px 12px 4px 4px;padding:10px 6px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:2px}
.pod .rk{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.pod .nm{font-weight:700;font-size:13px;overflow-wrap:anywhere;line-height:1.25}
.pod .sb{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.pod .pt{font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.pod.r1{border-color:var(--gold);padding-block:18px 12px;background:var(--soft)} .pod.r1 .rk{color:var(--gold)}
.pod.r2 .rk{color:var(--silver)} .pod.r3 .rk{color:var(--bronze)}
.list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .rk{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.li .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.li .sb{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.li .pt{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.li.mine{background:var(--soft);box-shadow:inset 3px 0 0 var(--turmeric)}
.empty-state{padding:22px 14px;text-align:center;color:var(--muted)}
.rule{font-size:12px;color:var(--muted);line-height:1.5}
table.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}

.float{position:absolute;font-family:var(--display);font-weight:800;font-size:20px;pointer-events:none;z-index:4;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;z-index:6;pointer-events:none;white-space:nowrap}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.float,.shake{animation:none}.float{display:none}}
@media (max-height:640px){.cust{min-height:112px}.quote{display:none}.ov h1{font-size:34px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="stat"><span>Ngày</span><b id="sDay">1</b></div>
    <div class="stat time"><span>Giờ</span><b id="sTime">75s</b></div>
    <div class="stat"><span>Hôm nay</span><b id="sEarn">0k</b></div>
    <div class="stat"><span>Uy tín</span><b id="sRep" class="hearts"></b></div>
  </div>
  <div class="event" id="sEvent"></div>
  <div class="tables" id="tables"></div>
  <div class="station">
    <svg id="bowl" viewBox="0 0 240 150" aria-label="Tô mì"></svg>
    <div class="hint" id="hint"></div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="acts">
    <button class="btn ghost" id="trash">Đổ bỏ</button>
    <button class="btn pour" id="pour">Chan nước lèo</button>
  </div>
  <div class="ov" id="ov"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ================= Cấu hình ================= */
const SB_URL = 'https://fvacenxojembebqqxgfp.supabase.co';
const SB_KEY = 'sb_publishable_w4bY8tj9UT-6sFUlXBlOdA_XBEH76qD'; // khoá công khai, an toàn khi để ở client
let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { sb = null; }

/* ================= Dữ liệu game ================= */
const ING = {
  mi:{n:'Mì',s:'<path d="M5 13c4-4 8 4 12 0s8 4 12 0 6-2 6-2M5 20c4-4 8 4 12 0s8 4 12 0 6-2 6-2M5 27c4-4 8 4 12 0s8 4 12 0 6-2 6-2" fill="none" stroke="#E8A317" stroke-width="3.4" stroke-linecap="round"/>'},
  tom:{n:'Tôm',s:'<path d="M11 27a10 10 0 1 1 17-13" fill="none" stroke="#E8622C" stroke-width="7" stroke-linecap="round"/><path d="M13 19l5 2M17 13l3 4M23 11l1 5" stroke="#F6A57E" stroke-width="1.6" stroke-linecap="round"/><path d="M28 14l7-4-2 9z" fill="#E8622C"/><circle cx="12" cy="25" r="1.6" fill="#3a1d10"/>'},
  thit:{n:'Thịt heo',s:'<rect x="5" y="12" width="30" height="16" rx="6" fill="#D98B7A" stroke="#8a4a3a" stroke-width="1.5"/><path d="M9 17h22" stroke="#F6E3D6" stroke-width="3" stroke-linecap="round"/>'},
  ga:{n:'Gà ta',s:'<ellipse cx="16" cy="17" rx="11" ry="9" fill="#B8692E"/><path d="M24 23l7 7" stroke="#F3E6CF" stroke-width="4" stroke-linecap="round"/><circle cx="33" cy="30" r="2.8" fill="#F3E6CF"/><circle cx="30" cy="33" r="2.8" fill="#F3E6CF"/>'},
  trung:{n:'Trứng cút',s:'<ellipse cx="20" cy="21" rx="10" ry="12" fill="#F4ECDC" stroke="#9b8466" stroke-width="1.5"/><circle cx="16" cy="16" r="1.8" fill="#6b5236"/><circle cx="23" cy="23" r="2.2" fill="#6b5236"/><circle cx="17" cy="27" r="1.4" fill="#6b5236"/><circle cx="24" cy="15" r="1.2" fill="#6b5236"/>'},
  dau:{n:'Đậu phộng',s:'<circle cx="14" cy="20" r="7" fill="#D9A45B"/><circle cx="26" cy="20" r="7" fill="#D9A45B"/><path d="M14 14v12M26 14v12" stroke="#a8743a" stroke-width="1.2"/>'},
  banhtrang:{n:'Bánh tráng',s:'<circle cx="20" cy="20" r="14" fill="#EFD39A" stroke="#c99a4b" stroke-width="1.5"/><g fill="#2b2118"><ellipse cx="14" cy="15" rx="1.4" ry=".8"/><ellipse cx="24" cy="13" rx="1.4" ry=".8"/><ellipse cx="27" cy="22" rx="1.4" ry=".8"/><ellipse cx="17" cy="25" rx="1.4" ry=".8"/><ellipse cx="21" cy="19" rx="1.4" ry=".8"/><ellipse cx="12" cy="21" rx="1.4" ry=".8"/></g>'},
  rau:{n:'Rau sống',s:'<path d="M7 33C7 17 19 6 34 6c0 15-11 27-27 27z" fill="#4E9A3F"/><path d="M8 32L30 10" stroke="#2F6B3A" stroke-width="2" stroke-linecap="round"/>'}
};
const TOPS=['tom','thit','ga','trung','dau','banhtrang','rau'];
const POS={tom:[52,26],thit:[92,20],ga:[134,22],trung:[170,32],dau:[70,44],banhtrang:[110,40],rau:[148,46]};
const KHACH=[
  ['CNTT','Công nghệ thông tin','#1B3A6B'],['CK','Cơ khí','#6B4A2B'],['Điện','Điện','#C8321E'],
  ['XD','Xây dựng','#5A6270'],['Hóa','Hóa','#2F6B3A'],['ĐTVT','Điện tử viễn thông','#7B3F8C'],
  ['KT','Kiến trúc','#B5651D'],['MT','Môi trường','#2E7D7A'],['GT','Cơ khí giao thông','#8A2E4B']];
const LINES=['Chiều thi Giải tích 2, ăn cho tỉnh!','Chạy deadline đồ án, nhanh giúp em','Vừa học xong ở khu H','Code xuyên đêm, đói quá chú ơi','Mới đá bóng ở sân trường về','Ăn xong lên thư viện ôn bài','Chủ nhật về quê, nay ăn bữa chót','Cho em xin thêm ớt nha','Lab tới 9 giờ tối, ăn lót dạ','Nghe nói tô ở đây ngon nhất Liên Chiểu'];
const EVENTS=[
  {n:'Ngày thường',d:'Khách đến đều đều.',spawn:1,pat:1,tip:1},
  {n:'Giờ tan học',d:'Khách đông hơn một chút.',spawn:.8,pat:1,tip:1},
  {n:'Tuần thi cuối kỳ',d:'Khách đông gấp rưỡi và rất vội.',spawn:.62,pat:.8,tip:1},
  {n:'Mưa bão miền Trung',d:'Ít khách, nhưng ai ghé cũng tip gấp đôi.',spawn:1.5,pat:1.2,tip:2}];
const UPG=[
  {id:'quat',n:'Quạt máy',d:'Khách chờ lâu hơn 25%',c:80},
  {id:'phubep',n:'Phụ bếp',d:'Tô nào cũng có sẵn mì',c:100},
  {id:'bang',n:'Bảng hiệu Bách Khoa',d:'Giá +10%, khách đến nhanh hơn',c:120},
  {id:'ban',n:'Thêm bàn thứ 4',d:'Phục vụ 4 khách cùng lúc',c:150}];
/* Độ khó: phải khớp hàm he_so() trên server */
const DIFF={
  thuong:{n:'Thường',hs:1,  pat:1,   spawn:1,   top:0,   tgt:1,   color:'#2F6B3A'},
  kho:   {n:'Khó',   hs:1.5,pat:.8,  spawn:.85, top:.6,  tgt:1.15,color:'#C99A1E'},
  dianguc:{n:'Địa ngục',hs:2.2,pat:.62,spawn:.7,top:1.2, tgt:1.3, color:'#C8321E'}};
const phat=k=>Math.round(15*DIFF[k].hs**2);
const DAYLEN=75;

/* ================= Trạng thái ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=k=>`<svg viewBox="0 0 40 40">${ING[k].s}</svg>`;
let S,D,last=0,running=false;
let user=null, profile=null, myRank=null, khoaList=[], diff='thuong', runId=null, ranked=false, submitting=false;
try{ diff=localStorage.getItem('mqbk-diff')||'thuong'; if(!DIFF[diff]) diff='thuong'; }catch(e){}
let guestBest={day:0,money:0};
try{guestBest=JSON.parse(localStorage.getItem('mqbk-best'))||guestBest}catch(e){}

const target=d=>Math.round((120+40*(d-1))*DIFF[diff].tgt);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= Vòng chơi ================= */
function newGame(){S={day:1,money:0,rep:5,upg:{},total:0};startDay()}
function startDay(){
  const n=S.upg.ban?4:3;
  D={t:DAYLEN,earned:0,served:0,lost:0,slots:Array(n).fill(null),spawnT:1.2,
     bowl:{items:new Set(S.upg.phubep?['mi']:[]),broth:false},ev:EVENTS[(S.day-1)%4]};
  $('ov').hidden=true; renderAll(); running=true; last=performance.now(); requestAnimationFrame(loop);
}
function spawn(){
  const i=D.slots.findIndex(x=>!x); if(i<0) return;
  const df=DIFF[diff], kh=pick(KHACH), teacher=Math.random()<.08;
  const nTop=Math.min(4,Math.max(1,Math.floor(rnd(1,2.6+S.day*.35+df.top))));
  const tops=[...TOPS].sort(()=>Math.random()-.5).slice(0,nTop);
  const order=['mi',...TOPS.filter(t=>tops.includes(t))];
  let max=(Math.max(12,22-S.day*.8)+nTop*2.5)*(S.upg.quat?1.25:1)*D.ev.pat*df.pat*(teacher?.8:1);
  const price=(25+5*nTop)*(S.upg.bang?1.1:1)*(teacher?2:1);
  D.slots[i]={kh,teacher,order,max,p:max,price,line:teacher?'Thầy ghé ăn trưa, nhanh giúp thầy nhé':pick(LINES)};
  renderTables();
}
function loop(now){
  if(!running) return;
  const dt=Math.min(.1,(now-last)/1000); last=now;
  D.t-=dt;
  if(D.t>0){
    D.spawnT-=dt;
    if(D.spawnT<=0){spawn();const base=Math.max(2.4,5.6-S.day*.3)*(S.upg.bang?.88:1)*DIFF[diff].spawn;D.spawnT=rnd(base*.7,base*1.3)*D.ev.spawn}
  }
  D.slots.forEach((c,i)=>{if(!c)return;c.p-=dt;if(c.p<=0&&running)angry(i,'Khách bỏ đi vì chờ lâu')});
  if(!running) return;
  updateBars();
  if(D.t<=0){endDay();return}
  requestAnimationFrame(loop);
}
function angry(i,msg){
  D.slots[i]=null; S.rep--; D.lost++; toast(msg);
  const el=$('tables').children[i]; if(el) el.classList.add('shake');
  renderTables(); renderStats();
  if(S.rep<=0){running=false;setTimeout(()=>finishRun('Mất hết uy tín, sinh viên rủ nhau sang quán khác.'),400)}
}
function serve(i){
  const c=D.slots[i]; if(!c||!running) return;
  const b=D.bowl;
  if(!b.items.size){toast('Tô còn trống');return}
  if(!b.broth){toast('Chưa chan nước lèo');return}
  const want=new Set(c.order);
  const ok=want.size===b.items.size&&[...want].every(x=>b.items.has(x));
  const el=$('tables').children[i];
  resetBowl();
  if(!ok){angry(i,'Sai món rồi, khách không chịu');return}
  const tip=Math.round(c.price*.3*(c.p/c.max)*D.ev.tip);
  const gain=Math.round(c.price)+tip;
  D.earned+=gain;S.money+=gain;S.total+=gain;D.served++;
  floatText(el,`+${gain}k`,tip>0?'var(--leaf)':'var(--navy)');
  D.slots[i]=null; renderTables(); renderStats();
}
function resetBowl(){D.bowl={items:new Set(S.upg.phubep?['mi']:[]),broth:false};renderBowl();renderPad()}
function endDay(){
  running=false;
  if(D.earned<target(S.day)){finishRun(`Hôm nay chỉ bán được ${D.earned}k, chưa đủ ${target(S.day)}k tiền mặt bằng.`);return}
  showShop();
}

/* ================= Kết thúc lượt & nộp điểm ================= */
async function finishRun(why, cashOut=false){
  running=false;
  const lost=Math.max(0,5-S.rep);
  const hs=DIFF[diff].hs;
  const est=Math.round(S.total*hs/10)-Math.round(lost*15*hs**2);
  const ov=$('ov'); ov.hidden=false;
  const head=cashOut?`<div class="eyebrow">Chốt sổ · ${DIFF[diff].n}</div><h2>Nghỉ bán sau ${S.day} ngày</h2>`
                     :`<div class="eyebrow">Quán tạm đóng cửa · ${DIFF[diff].n}</div><h2>Trụ được ${S.day} ngày</h2>`;
  const summary=`<div class="sum"><span>Tổng doanh thu</span><b>${S.total}k</b><span>Tim đã mất</span><b>${lost}</b>
    <span>Thưởng (${S.total}k × ${hs} ÷ 10)</span><b>+${Math.round(S.total*hs/10)}</b>
    <span>Phạt (${lost} tim × ${phat(diff)})</span><b>−${Math.round(lost*15*hs**2)}</b></div>`;
  if(!ranked){
    if(S.day>guestBest.day||(S.day===guestBest.day&&S.total>guestBest.money)){guestBest={day:S.day,money:S.total};try{localStorage.setItem('mqbk-best',JSON.stringify(guestBest))}catch(e){}}
    ov.innerHTML=`${head}<p>${esc(why)}</p>${summary}
      <p class="muted">Lượt chơi thử không được tính điểm. Nếu đăng nhập, lượt này sẽ ${est>=0?'cộng':'trừ'} <b>${Math.abs(est)}</b> ĐBK.</p>
      <div class="col grow"><button class="btn" id="again">Chơi lại</button><button class="btn ghost" id="home">Về màn hình chính</button></div>`;
    $('again').onclick=()=>startRun(); $('home').onclick=home; return;
  }
  ov.innerHTML=`${head}<p>${esc(why)}</p>${summary}<div class="msg" id="msg">Đang nộp điểm…</div>`;
  submitting=true;
  const {data,error}=await sb.rpc('nop_ket_qua',{p_run_id:runId,p_so_ngay:S.day,p_doanh_thu:S.total,p_tim_mat:lost});
  submitting=false; runId=null;
  if(error){
    ov.innerHTML=`${head}${summary}<div class="msg">Không nộp được điểm: ${esc(error.message)}</div>
      <div class="col grow"><button class="btn" id="home">Về màn hình chính</button></div>`;
    $('home').onclick=home; return;
  }
  if(profile) profile.diem=data.diem; myRank=data.hang;
  const d=data.delta;
  ov.innerHTML=`${head}<p>${esc(why)}</p>
    <div><div class="eyebrow">Điểm Bách Khoa</div>
      <div class="big" style="color:${d>=0?'var(--leaf)':'var(--chili)'}">${d>=0?'+':'−'}${Math.abs(d)}</div>
      <p class="muted">Bây giờ bạn có <b>${data.diem}</b> ĐBK, hạng <b>#${data.hang}</b> toàn trường.</p></div>
    ${summary}
    <div class="col grow"><button class="btn" id="again">Chơi lượt mới</button>
      <button class="btn ghost" id="lb">Xem bảng xếp hạng</button><button class="link" id="home">Về màn hình chính</button></div>`;
  $('again').onclick=()=>startRun(); $('lb').onclick=()=>leaderboard('sv'); $('home').onclick=home;
}

function renderAll(){renderStats();renderTables();renderBowl();renderPad()}
function renderStats(){
  $('sDay').textContent=S.day; $('sEarn').textContent=`${D.earned}/${target(S.day)}k`;

}
function renderTables(){
  const t=$('tables'); t.style.setProperty('--n',D.slots.length);
  t.innerHTML=D.slots.map((c,i)=>{
    if(!c) return `<div class="cust empty">Bàn trống</div>`;
    const name=c.teacher?`Thầy khoa ${c.kh[1]}`:`SV ${c.kh[1]}`;
    return `<div class="cust${c.teacher?' teacher':''}" data-i="${i}" role="button" tabindex="0" aria-label="Phục vụ ${name}">

      <div class="quote">${c.line}</div><div class="pat"><i></i></div></div>`}).join('');

}
function updateBars(){
  $('sTime').textContent=Math.max(0,Math.ceil(D.t))+'s';
  [...$('tables').children].forEach((el,i)=>{
    const c=D.slots[i]; if(!c) return; const r=Math.max(0,c.p/c.max);
    const bar=el.querySelector('.pat i'); bar.style.width=(r*100)+'%';
    bar.style.background=r>.5?'var(--leaf)':r>.25?'var(--turmeric)':'var(--chili)';
  });
}
function renderBowl(){
  const b=D.bowl;
  let s=`<defs><clipPath id="in"><ellipse cx="120" cy="52" rx="98" ry="29"/></clipPath></defs>
  <ellipse cx="120" cy="143" rx="62" ry="6" fill="#E6D6B8"/>
  <path d="M18 52 Q26 138 120 138 Q214 138 222 52 Z" fill="#1B3A6B"/>
  <path d="M30 86 Q120 112 210 86" fill="none" stroke="#FBF3E3" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M40 106 Q120 128 200 106" fill="none" stroke="#5C7BB0" stroke-width="2"/>
  <ellipse cx="120" cy="52" rx="104" ry="33" fill="#FBF3E3" stroke="#1B3A6B" stroke-width="5"/><g clip-path="url(#in)">`;
  if(b.items.has('mi')) for(let y=28;y<84;y+=7) s+=`<path d="M14 ${y} q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#E8A317" stroke-width="4" stroke-linecap="round"/>`;

}
function renderPad(){

function viErr(m){
  if(/Invalid login/i.test(m)) return 'Sai email hoặc mật khẩu.';
  if(/not confirmed/i.test(m)) return 'Email chưa được xác nhận. Kiểm tra hộp thư (cả mục Spam).';
  if(/already registered/i.test(m)) return 'Email này đã có tài khoản, hãy đăng nhập.';
  if(/rate limit/i.test(m)) return 'Hệ thống đang quá tải email, thử lại sau ít phút.';
  return m;
}

  document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)leaderboard(b.dataset.t)};
  $('rule').innerHTML=tab==='sv'?ruleText():tab==='lop'
    ?'Điểm lớp = tổng ĐBK của 10 bạn cao nhất lớp, chia 10. Lớp chưa đủ 10 người chơi thì phần thiếu tính là 0.'
    :'Điểm khoa = tổng ĐBK của 30 bạn cao nhất khoa, chia 30.';
  if(!sb){$('lbBody').innerHTML='<div class="empty-state">Không kết nối được máy chủ bảng xếp hạng.</div>';return}
  let rows=[],err=null;
  if(tab==='sv'){({data:rows,error:err}=await sb.from('bxh_sinh_vien').select('id,ten,lop,khoa,diem,hang').order('diem',{ascending:false}).limit(50))}
  else if(tab==='lop'){({data:rows,error:err}=await sb.from('bxh_lop').select('lop,khoa_id,so_nguoi,diem,hang').order('hang').limit(50))}
  else {({data:rows,error:err}=await sb.from('bxh_khoa').select('khoa_id,khoa,so_nguoi,diem,hang').order('hang'))}
  if(err){$('lbBody').innerHTML=`<div class="empty-state">Không tải được: ${esc(err.message)}</div>`;return}
  rows=rows||[];
  const norm=rows.map(r=>tab==='sv'
    ?{rk:r.hang,nm:r.ten,sb:`${r.lop} · ${r.khoa}`,pt:r.diem,mine:user&&r.id===user.id}
    :tab==='lop'?{rk:r.hang,nm:r.lop,sb:`${khoaTen(r.khoa_id)} · ${r.so_nguoi} người chơi`,pt:r.diem,mine:profile&&r.lop===profile.lop}
    :{rk:r.hang,nm:r.khoa,sb:`${r.so_nguoi} người chơi`,pt:r.diem,mine:profile&&r.khoa_id===profile.khoa_id});
  if(!norm.length||(tab!=='khoa'&&!norm.length)){$('lbBody').innerHTML=`<div class="empty-state">Chưa có ai trên bảng. Chơi một lượt để ghi tên ${tab==='lop'?'lớp bạn':'mình'} đầu tiên.</div>`;return}
  const top=norm.slice(0,3), rest=norm.slice(3);
  const pod=(r,i)=>r?`<div class="pod r${i+1}${r.mine?' mine':''}"><div class="rk">${r.rk}</div><div class="nm">${esc(r.nm)}</div><div class="sb">${esc(r.sb)}</div><div class="pt">${r.pt}</div></div>`:'<div></div>';
  let html=`<div class="podium">${pod(top[1],1)}${pod(top[0],0)}${pod(top[2],2)}</div>`;
  if(rest.length) html+=`<div class="list">${rest.map(r=>`<div class="li${r.mine?' mine':''}"><span class="rk">#${r.rk}</span><span class="nm">${esc(r.nm)}<span class="sb">${esc(r.sb)}</span></span><span class="pt">${r.pt}</span></div>`).join('')}</div>`;
  if(tab==='sv'&&profile&&myRank&&!norm.some(r=>r.mine)) html+=`<div class="list"><div class="li mine"><span class="rk">#${myRank}</span><span class="nm">${esc(profile.ten)}<span class="sb">Bạn</span></span><span class="pt">${profile.diem}</span></div></div>`;
  $('lbBody').innerHTML=html;
}
function ruleText(){
  return `<b>Cách tính ĐBK mỗi lượt:</b> doanh thu × hệ số ÷ 10, trừ số tim mất × mức phạt. Bỏ dở lượt giữa chừng tính như mất cả 5 tim.
  <div style="overflow-x:auto;margin-top:6px"><table class="tb"><tr><th>Độ khó</th><th>Hệ số</th><th>Phạt/tim</th><th>Mất 5 tim</th></tr>
  ${Object.entries(DIFF).map(([k,v])=>`<tr><td>${v.n}</td><td>×${v.hs}</td><td>−${phat(k)}</td><td>−${Math.round(5*15*v.hs**2)}</td></tr>`).join('')}</table></div>`;
}

/* ================= Hiệu ứng ================= */
let toastT;
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),1400)}
function floatText(el,txt,col){if(!el)return;const r=el.getBoundingClientRect(),a=$('app').getBoundingClientRect();
  const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.color=col;
  f.style.left=(r.left-a.left+r.width/2-24)+'px';f.style.top=(r.top-a.top+20)+'px';$('app').appendChild(f);setTimeout(()=>f.remove(),1000)}

/* ================= Điều khiển ================= */
$('pad').addEventListener('click',e=>{const b=e.target.closest('.ing');if(!b||!running)return;const k=b.dataset.k,it=D.bowl.items;
  if(D.bowl.broth){toast('Đã chan nước, đổ bỏ để làm lại');return}
  if(k!=='mi'&&!it.has('mi')){toast('Cho mì vào trước đã');return}
  if(it.has(k)){if(k==='mi'&&it.size>1){toast('Bỏ topping trước khi bỏ mì');return}it.delete(k)}else it.add(k);
  renderBowl();renderPad()});
$('pour').onclick=()=>{if(!running||!D.bowl.items.has('mi'))return;D.bowl.broth=true;renderBowl()};
$('trash').onclick=()=>{if(running)resetBowl()};
$('tables').addEventListener('click',e=>{const c=e.target.closest('.cust[data-i]');if(c)serve(+c.dataset.i)});
$('tables').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.cust[data-i]');if(c){e.preventDefault();serve(+c.dataset.i)}}});
window.addEventListener('beforeunload',e=>{if(ranked&&runId&&!submitting){e.preventDefault();e.returnValue=''}});

/* ================= Khởi động ================= */
S={day:1,money:0,rep:5,upg:{},total:0};
D={t:DAYLEN,earned:0,served:0,lost:0,slots:[null,null,null],spawnT:1,bowl:{items:new Set(['mi','tom','trung','rau']),broth:true},ev:EVENTS[0]};
renderAll();
(async function boot(){
  if(!sb){ranked=false;home();return}
  openOv('<div class="empty-state">Đang mở quán…</div>');
  try{
    await loadKhoa();
    const {data:{session}}=await sb.auth.getSession();
    user=session?.user||null;
    if(user) await afterLogin(); else authScreen();
  }catch(e){ranked=false;home();toast('Không kết nối được máy chủ, đang chơi thử')}
})();
</script>
